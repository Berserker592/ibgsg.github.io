<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SongWriter PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --surface: #0d1321;
    --surface2: #131b2e;
    --border: #1c2740;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,.25);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: #e2e8f0;
    margin: 0;
    height: 100dvh;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Scrollbar */
  .custom-scroll::-webkit-scrollbar { width: 4px; }
  .custom-scroll::-webkit-scrollbar-thumb { background: #2a3548; border-radius: 99px; }

  /* Textareas */
  .sec-textarea {
    font-family: 'JetBrains Mono', monospace;
    background: #0a0f1a;
    border: 1px solid var(--border);
    color: #f1f5f9;
    width: 100%;
    padding: 14px 14px 14px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.6;
    outline: none;
    resize: none;
    min-height: 110px;
    transition: border-color .15s, box-shadow .15s;
  }
  .sec-textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* Chord styles in preview */
  .acorde-final { color: #3b82f6 !important; font-weight: 800 !important; font-family: 'JetBrains Mono', monospace !important; }
  .tag-seccion { color: #f97316 !important; font-weight: 800 !important; font-size: 0.7em; display: block; letter-spacing: 1.5px; margin-bottom: 4px; text-transform: uppercase; }

  .dos-columnas { column-count: 2; column-gap: 28px; column-rule: 1px solid #e5e7eb; }
  .no-break { break-inside: avoid; }
  #render-target { background: #fff !important; color: #000 !important; font-family: 'JetBrains Mono', monospace !important; }
  #render-target p { font-family: 'JetBrains Mono', monospace !important; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-weight: 700; font-size: 12px; border-radius: 11px;
    transition: all .15s; user-select: none; cursor: pointer;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,.35); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-success { background: linear-gradient(135deg,#10b981,#059669); color: #fff; box-shadow: 0 4px 14px rgba(16,185,129,.3); }
  .btn-ghost { background: var(--surface2); color: #94a3b8; border: 1px solid var(--border); }
  .btn-ghost:hover { background: #1a2438; color: #e2e8f0; }
  .btn-danger { background: #be123c22; color: #fb7185; border: 1px solid #be123c44; }
  .btn-danger:hover { background: #be123c33; }

  /* Section card */
  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-left-width: 4px;
    transition: border-color .15s;
  }

  /* Chord picker */
  .chord-picker {
    background: #0a0f1a;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
  }
  .chord-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: #cbd5e1;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    padding: 7px 0;
    border-radius: 8px;
    transition: all .12s;
    cursor: pointer;
  }
  .chord-btn:hover { background: #1e293b; border-color: #6366f1; color: #a5b4fc; }
  .chord-btn.active { background: #4f46e5; border-color: #6366f1; color: #fff; }

  /* Toast */
  #toast {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(16px);
    padding: 12px 24px; border-radius: 999px;
    background: linear-gradient(135deg,#6366f1,#4f46e5);
    color: #fff; font-weight: 700; font-size: 13px; z-index: 400;
    opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 12px 40px rgba(99,102,241,.45);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .55s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .view-panel { display: none; }
    .view-panel.active { display: flex; flex-direction: column; }
  }

  /* Range */
  input[type=range] { accent-color: #6366f1; height: 4px; }
</style>
</head>
<body class="flex flex-col">

<!-- ========== HEADER ========== -->
<header class="bg-[var(--surface)] border-b border-[var(--border)] px-3 py-2.5 flex items-center justify-between shrink-0 z-50">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-indigo-500/30">♪</div>
    <div class="hidden sm:block">
      <input id="app-name-input" value="SongWriter PRO" class="bg-transparent border-none outline-none text-indigo-300 font-extrabold text-sm w-40" oninput="App.saveLocal('sw_app_name',this.value)">
    </div>
  </div>

  <div class="flex items-center gap-1.5">
    <button onclick="App.guardar()" class="btn btn-primary px-3.5 py-2 text-[11px]">💾 <span class="hidden sm:inline">Guardar</span></button>
    <button id="btn-publish" onclick="App.publicarAlRepo()" class="btn btn-success px-3.5 py-2 text-[11px] hidden">☁️ <span class="hidden sm:inline">Publicar</span></button>
    <button onclick="App.descargarPDFDirecto()" class="btn btn-ghost px-3 py-2 text-[11px]">PDF</button>
    <button onclick="App.exportarPDF()" class="btn btn-ghost px-3 py-2 text-[11px] hidden sm:flex">Imprimir</button>
    <button onclick="App.toggleBib(true)" class="btn btn-ghost p-2">📚</button>
    <button onclick="App.toggleConfig(true)" class="btn btn-ghost p-2">⚙️</button>
  </div>
</header>

<!-- ========== MAIN ========== -->
<main class="flex flex-1 overflow-hidden">

  <!-- EDITOR -->
  <section id="panel-editor" class="view-panel active w-full md:w-[47%] flex flex-col border-r border-[var(--border)]">
    <div class="flex-1 overflow-y-auto custom-scroll p-3 md:p-5">
      <div class="max-w-xl mx-auto space-y-4">

        <!-- Title -->
        <input id="titulo" type="text" placeholder="Título de la canción..."
               class="w-full bg-transparent text-2xl font-black border-b-2 border-[var(--border)] outline-none pb-2 focus:border-indigo-500 transition placeholder:text-slate-600">

        <!-- Meta row -->
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1.5">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Tono</label>
            <input id="tono" placeholder="G#m" class="w-full p-2.5 rounded-xl bg-[var(--surface)] border border-[var(--border)] text-sm outline-none focus:border-indigo-500 mono">
            <div class="flex gap-1">
              <button onclick="App.transportar(-1)" class="btn btn-ghost flex-1 py-1.5 text-[11px]">−1</button>
              <button onclick="App.transportar(-0.5)" class="btn btn-ghost flex-1 py-1.5 text-[11px]">−½</button>
              <button onclick="App.transportar(0.5)" class="btn btn-ghost flex-1 py-1.5 text-[11px]">+½</button>
              <button onclick="App.transportar(1)" class="btn btn-ghost flex-1 py-1.5 text-[11px]">+1</button>
            </div>
          </div>
          <div class="space-y-1.5">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">BPM</label>
            <input id="bpm" type="number" placeholder="72" class="w-full p-2.5 rounded-xl bg-[var(--surface)] border border-[var(--border)] text-sm outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- Display controls -->
        <div class="bg-[var(--surface)] rounded-2xl border border-[var(--border)] p-3.5 space-y-3">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <span class="text-[11px] font-semibold text-slate-400">Tamaño: <span id="val-size" class="text-indigo-400">16px</span></span>
            <div class="flex gap-4">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="check-notas" checked onchange="App.render()" class="w-4 h-4 accent-indigo-500 rounded">
                <span class="text-[11px] font-semibold text-indigo-300">Acordes</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="check-cols" onchange="App.render()" class="w-4 h-4 accent-indigo-500 rounded">
                <span class="text-[11px] font-semibold text-slate-400">2 columnas</span>
              </label>
            </div>
          </div>
          <input type="range" id="font-size-range" min="11" max="26" value="16" oninput="App.updateFontSize(this.value)">
        </div>

        <!-- Chord Picker (always visible) -->
        <div class="chord-picker space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Insertar acorde</span>
            <span class="text-[10px] text-slate-600">Clic en una nota → elige tipo → se inserta</span>
          </div>

          <!-- Root notes -->
          <div class="grid grid-cols-6 gap-1.5" id="chord-roots">
            <button class="chord-btn" data-root="C">C</button>
            <button class="chord-btn" data-root="C#">C#</button>
            <button class="chord-btn" data-root="D">D</button>
            <button class="chord-btn" data-root="D#">D#</button>
            <button class="chord-btn" data-root="E">E</button>
            <button class="chord-btn" data-root="F">F</button>
            <button class="chord-btn" data-root="F#">F#</button>
            <button class="chord-btn" data-root="G">G</button>
            <button class="chord-btn" data-root="G#">G#</button>
            <button class="chord-btn" data-root="A">A</button>
            <button class="chord-btn" data-root="A#">A#</button>
            <button class="chord-btn" data-root="B">B</button>
          </div>

          <!-- Qualities -->
          <div class="grid grid-cols-5 gap-1.5" id="chord-qualities">
            <button class="chord-btn" data-q="">maj</button>
            <button class="chord-btn" data-q="m">m</button>
            <button class="chord-btn" data-q="7">7</button>
            <button class="chord-btn" data-q="m7">m7</button>
            <button class="chord-btn" data-q="maj7">maj7</button>
            <button class="chord-btn" data-q="sus4">sus4</button>
            <button class="chord-btn" data-q="sus2">sus2</button>
            <button class="chord-btn" data-q="dim">dim</button>
            <button class="chord-btn" data-q="aug">aug</button>
            <button class="chord-btn" data-q="add9">add9</button>
          </div>

          <div class="flex gap-2">
            <button onclick="App.insertChord()" class="btn btn-primary flex-1 py-2 text-[11px]">Insertar acorde</button>
            <button onclick="App.insertChord(true)" class="btn btn-ghost py-2 px-3 text-[11px]" title="Insertar y avanzar">↵</button>
          </div>
          <div id="chord-preview" class="text-center text-sm font-bold mono text-indigo-300 h-5"></div>
        </div>

        <!-- Sections -->
        <div id="lista-secciones" class="space-y-3 pb-44"></div>
      </div>
    </div>

    <!-- Bottom bar -->
    <div class="shrink-0 p-2 bg-[var(--surface)]/95 border-t border-[var(--border)] backdrop-blur">
      <div class="grid grid-cols-4 sm:grid-cols-8 gap-1 max-w-xl mx-auto">
        <button onclick="App.addSec('intro')" class="btn py-2.5 rounded-xl bg-sky-500/10 text-sky-300 text-[9px] font-bold hover:bg-sky-500/20">+ INTRO</button>
        <button onclick="App.addSec('estrofa')" class="btn py-2.5 rounded-xl bg-indigo-500/10 text-indigo-300 text-[9px] font-bold hover:bg-indigo-500/20">+ ESTROFA</button>
        <button onclick="App.addSec('precoro')" class="btn py-2.5 rounded-xl bg-purple-500/10 text-purple-300 text-[9px] font-bold hover:bg-purple-500/20">+ PRE</button>
        <button onclick="App.addSec('coro')" class="btn py-2.5 rounded-xl bg-emerald-500/10 text-emerald-300 text-[9px] font-bold hover:bg-emerald-500/20">+ CORO</button>
        <button onclick="App.addSec('puente')" class="btn py-2.5 rounded-xl bg-amber-500/10 text-amber-300 text-[9px] font-bold hover:bg-amber-500/20">+ PUENTE</button>
        <button onclick="App.addSec('instrumental')" class="btn py-2.5 rounded-xl bg-rose-500/10 text-rose-300 text-[9px] font-bold hover:bg-rose-500/20">+ INSTR</button>
        <button onclick="App.addSec('final')" class="btn py-2.5 rounded-xl bg-slate-500/10 text-slate-300 text-[9px] font-bold hover:bg-slate-500/20">+ FINAL</button>
        <button onclick="App.clearAll()" class="btn py-2.5 rounded-xl bg-red-500/10 text-red-400 text-[9px] font-bold hover:bg-red-500/20">LIMPIAR</button>
      </div>
    </div>
  </section>

  <!-- PREVIEW -->
  <section id="panel-previa" class="view-panel w-full md:w-[53%] bg-[#05080f] overflow-y-auto custom-scroll p-3 md:p-6">
    <div class="mx-auto bg-white text-slate-900 shadow-2xl rounded-xl min-h-full max-w-[700px] overflow-hidden">
      <div id="render-target" class="p-6 md:p-10"></div>
    </div>
  </section>
</main>

<!-- ========== BIBLIOTECA ========== -->
<div id="modal-bib" class="fixed inset-0 hidden z-[100] flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-sm p-0 sm:p-4">
  <div class="bg-[var(--surface)] w-full sm:max-w-lg sm:rounded-2xl border border-[var(--border)] shadow-2xl flex flex-col max-h-[88vh]">
    <div class="flex items-center justify-between p-4 border-b border-[var(--border)]">
      <div>
        <h2 class="font-bold text-indigo-300 text-sm">Biblioteca</h2>
        <p class="text-[11px] text-slate-500" id="bib-count">0 canciones</p>
      </div>
      <div class="flex gap-1.5">
        <button onclick="App.cargarDesdeRepo()" class="btn btn-ghost px-2.5 py-1.5 text-[10px]">🔄 Repo</button>
        <button onclick="document.getElementById('file-import').click()" class="btn btn-ghost px-2.5 py-1.5 text-[10px]">Importar</button>
        <button onclick="App.exportarDB()" class="btn btn-ghost px-2.5 py-1.5 text-[10px]">Backup</button>
        <button onclick="App.toggleBib(false)" class="btn btn-ghost px-2.5 py-1.5 text-base">✕</button>
      </div>
    </div>
    <div class="p-3 border-b border-[var(--border)]">
      <input id="search-bib" type="text" placeholder="Buscar canción..." oninput="App.filtrarBib(this.value)"
             class="w-full p-2.5 rounded-xl bg-[var(--bg)] border border-[var(--border)] text-sm outline-none focus:border-indigo-500">
    </div>
    <input type="file" id="file-import" class="hidden" accept=".json" onchange="App.importarDB(this)">
    <div id="lista-bib" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1.5"></div>
  </div>
</div>

<!-- ========== CONFIG ========== -->
<div id="modal-config" class="fixed inset-0 hidden z-[100] flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-sm p-0 sm:p-4">
  <div class="bg-[var(--surface)] w-full sm:max-w-md sm:rounded-2xl border border-[var(--border)] shadow-2xl flex flex-col max-h-[90vh]">
    <div class="flex items-center justify-between p-4 border-b border-[var(--border)]">
      <h2 class="font-bold text-indigo-300 text-sm">Configuración</h2>
      <button onclick="App.toggleConfig(false)" class="btn btn-ghost px-2.5 py-1.5 text-base">✕</button>
    </div>
    <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-5">
      <div>
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Nombre del Ministerio</label>
        <input id="cfg-church" type="text" class="w-full p-2.5 rounded-xl bg-[var(--bg)] border border-[var(--border)] text-sm outline-none focus:border-indigo-500" placeholder="Ministerio de Alabanza...">
      </div>

      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">GitHub · Publicar canciones</label>
          <span id="gh-status" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">No configurado</span>
        </div>
        <div class="bg-[var(--bg)] rounded-xl border border-[var(--border)] p-3.5 space-y-3">
          <div>
            <label class="text-[10px] text-slate-500 mb-1 block">Owner (usuario u organización)</label>
            <input id="cfg-gh-owner" type="text" placeholder="tu-usuario" class="w-full p-2 rounded-lg bg-[var(--surface)] border border-[var(--border)] text-sm outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-500 mb-1 block">Nombre del repositorio</label>
            <input id="cfg-gh-repo" type="text" placeholder="songwriter-pro" class="w-full p-2 rounded-lg bg-[var(--surface)] border border-[var(--border)] text-sm outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-500 mb-1 block">Fine-grained Token</label>
            <input id="cfg-gh-token" type="password" placeholder="github_pat_..." class="w-full p-2 rounded-lg bg-[var(--surface)] border border-[var(--border)] text-sm outline-none focus:border-indigo-500 mono">
          </div>
          <p class="text-[10px] text-slate-500 leading-relaxed">
            El token solo se guarda en <strong>tu navegador</strong>. Nunca se sube al repositorio.<br>
            Permiso necesario: <strong>Contents → Read and write</strong>.
          </p>
        </div>
      </div>

      <button onclick="App.saveConfig()" class="btn btn-primary w-full py-3">Guardar configuración</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const App = {
  configs: {
    intro: 'border-sky-500', estrofa: 'border-indigo-500', precoro: 'border-purple-500',
    coro: 'border-emerald-500', puente: 'border-amber-500', instrumental: 'border-rose-500', final: 'border-slate-400'
  },
  currentFontSize: 16,
  notasEscala: ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
  churchName: 'Ministerio de Alabanza',
  gh: { owner:'', repo:'', token:'' },
  selectedRoot: null,
  selectedQuality: '',
  lastFocusedTextarea: null,

  init() {
    document.getElementById('app-name-input').value = localStorage.getItem('sw_app_name') || 'SongWriter PRO';
    this.churchName = localStorage.getItem('sw_church') || 'Ministerio de Alabanza';
    const saved = JSON.parse(localStorage.getItem('sw_gh') || '{}');
    this.gh = { owner: saved.owner||'', repo: saved.repo||'', token: saved.token||'' };
    this.updatePublishBtn();

    this.elLista = document.getElementById('lista-secciones');
    Sortable.create(this.elLista, { handle: '.drag-handle', animation: 150, onEnd: () => this.render() });

    ['titulo','tono','bpm'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', () => this.render());
    });

    // Chord picker events
    document.querySelectorAll('#chord-roots .chord-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#chord-roots .chord-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.selectedRoot = btn.dataset.root;
        this.updateChordPreview();
      });
    });
    document.querySelectorAll('#chord-qualities .chord-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#chord-qualities .chord-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.selectedQuality = btn.dataset.q;
        this.updateChordPreview();
      });
    });

    // Track last focused textarea
    document.addEventListener('focusin', e => {
      if (e.target.classList.contains('sec-textarea')) this.lastFocusedTextarea = e.target;
    });

    this.cargarDesdeRepo(true);
    this.render();
  },

  saveLocal(k,v){ localStorage.setItem(k,v); },

  updateFontSize(v){
    this.currentFontSize = v;
    document.getElementById('val-size').textContent = v+'px';
    this.render();
  },

  updateChordPreview(){
    const el = document.getElementById('chord-preview');
    if(!this.selectedRoot){ el.textContent = ''; return; }
    el.textContent = `[${this.selectedRoot}${this.selectedQuality}]`;
  },

  insertChord(addSpace = false){
    if(!this.selectedRoot){ this.notify('⚠️ Elige una nota primero'); return; }
    const chord = `[${this.selectedRoot}${this.selectedQuality}]`;
    const ta = this.lastFocusedTextarea || document.querySelector('.sec-textarea');
    if(!ta){ this.notify('⚠️ Haz clic en una sección primero'); return; }

    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const text = ta.value;
    const insert = chord + (addSpace ? ' ' : '');
    ta.value = text.slice(0,start) + insert + text.slice(end);
    ta.focus();
    const newPos = start + insert.length;
    ta.setSelectionRange(newPos, newPos);
    this.render();
  },

  addSec(tipo, txt=''){
    const div = document.createElement('div');
    div.className = `section-card p-3.5 ${this.configs[tipo]||'border-slate-500'}`;
    div.dataset.tipo = tipo;
    div.innerHTML = `
      <div class="flex justify-between items-center mb-2">
        <span class="drag-handle text-[10px] font-bold uppercase tracking-wider text-slate-500 cursor-grab flex items-center gap-1.5">
          <span class="opacity-50">⠿</span> ${tipo}
        </span>
        <button onclick="this.closest('[data-tipo]').remove();App.render()" class="text-slate-600 hover:text-rose-400 transition text-sm px-1">✕</button>
      </div>
      <textarea class="sec-textarea" oninput="App.render()" placeholder="Escribe la letra aquí...&#10;Usa el selector de acordes de arriba">${txt}</textarea>
    `;
    this.elLista.appendChild(div);
    this.render();
    const ta = div.querySelector('textarea');
    setTimeout(()=>{ ta.focus(); this.lastFocusedTextarea = ta; }, 50);
  },

  clearAll(){
    if(!confirm('¿Borrar todas las secciones?')) return;
    this.elLista.innerHTML = '';
    this.render();
    this.notify('Secciones eliminadas');
  },

  transportar(pasos){
    document.querySelectorAll('.sec-textarea').forEach(box=>{
      box.value = box.value.replace(/\[(.*?)\]/g,(_,n)=>`[${this.cambiarNota(n,pasos)}]`);
    });
    const tono = document.getElementById('tono');
    if(tono.value) tono.value = this.cambiarNota(tono.value,pasos);
    this.render();
    this.notify(`Transportado ${pasos>0?'+':''}${pasos}`);
  },

  cambiarNota(notaStr,pasos){
    const m = notaStr.match(/^([A-G][#b]?)(.*)/);
    if(!m) return notaStr;
    let raiz=m[1], sufijo=m[2];
    const bemoles={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
    if(bemoles[raiz]) raiz=bemoles[raiz];
    let i=this.notasEscala.indexOf(raiz);
    if(i===-1) return notaStr;
    let ni=(i+pasos*2)%12;
    while(ni<0) ni+=12;
    return this.notasEscala[ni]+sufijo;
  },

  render(){
    const t = document.getElementById('titulo').value || 'SIN TÍTULO';
    const tono = document.getElementById('tono').value || '—';
    const bpm = document.getElementById('bpm').value || '—';
    const cols = document.getElementById('check-cols').checked;
    const notas = document.getElementById('check-notas').checked;
    const items = [...document.querySelectorAll('#lista-secciones > div')];

    let html = `
      <div style="text-align:center;margin-bottom:20px">
        <div style="color:#f97316;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;
                    border-bottom:1.5px solid #f97316;padding-bottom:4px;margin-bottom:10px">${this.churchName}</div>
        <h1 style="font-size:22px;margin:0;font-weight:900;text-transform:uppercase;line-height:1.2;color:#000">${t}</h1>
        <div style="font-size:11px;margin-top:8px;border-top:1px solid #111;border-bottom:1px solid #111;
                    padding:5px 0;font-weight:700;color:#000">TONO: ${tono} &nbsp;|&nbsp; BPM: ${bpm}</div>
      </div>
      <div class="${cols?'dos-columnas':''}">`;

    let contE=1;
    items.forEach(it=>{
      const tipo=it.dataset.tipo;
      const raw=it.querySelector('textarea').value;
      const lines=raw.split('\n');
      let final=[];
      lines.forEach(line=>{
        if(!notas){
          const clean=line.replace(/\[.*?\]/g,'').trimEnd();
          if(clean.trim()) final.push(clean);
        } else {
          final.push(line.replace(/\[(.*?)\]/g,'<span class="acorde-final">$1</span>')
                         .replace(/\*(.*?)\*/g,'<i>$1</i>')
                         .replace(/_(.*?)_/g,'<u>$1</u>'));
        }
      });
      if(final.length){
        let label=tipo.toUpperCase();
        if(tipo==='estrofa') label+=' '+(contE++);
        html+=`<div class="no-break" style="margin-bottom:14px">
          <span class="tag-seccion">${label}</span>
          <p style="white-space:pre-wrap;margin:0;font-size:${this.currentFontSize}px;color:#1e293b;line-height:1.55">${final.join('\n')}</p>
        </div>`;
      }
    });
    html+='</div>';
    document.getElementById('render-target').innerHTML=html;
  },

  // PDF
  exportarPDF(){
    const content=document.getElementById('render-target').innerHTML;
    const win=window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>PDF</title><style>
      body{font-family:'JetBrains Mono',monospace;padding:40px;color:#000;background:#fff}
      .acorde-final{color:#3b82f6!important;font-weight:800!important}
      .tag-seccion{color:#f97316!important;font-weight:800!important;font-size:10px;display:block;text-transform:uppercase;margin-bottom:2px}
      .dos-columnas{column-count:2;column-gap:32px;column-rule:1px solid #eee}
      .no-break{break-inside:avoid} h1{font-weight:900} p{white-space:pre-wrap;margin:0;line-height:1.55}
    </style></head><body>${content}</body></html>`);
    win.document.close();
    setTimeout(()=>win.print(),500);
  },
  descargarPDFDirecto(){
    const el=document.getElementById('render-target');
    const titulo=document.getElementById('titulo').value||'cancion';
    this.notify('⏳ Generando PDF...');
    html2pdf().set({
      margin:[12,12], filename:`${titulo}.pdf`,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:3,useCORS:true,letterRendering:true},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
    }).from(el).save().then(()=>this.notify('✅ PDF descargado'));
  },

  // Save / Library
  getSongData(){
    const t=document.getElementById('titulo').value.trim();
    if(!t) return null;
    return {
      t, tono:document.getElementById('tono').value, bpm:document.getElementById('bpm').value,
      size:this.currentFontSize, cols:document.getElementById('check-cols').checked,
      notas:document.getElementById('check-notas').checked,
      secs:[...document.querySelectorAll('#lista-secciones > div')].map(s=>({tipo:s.dataset.tipo,txt:s.querySelector('textarea').value})),
      updated:new Date().toISOString()
    };
  },
  guardar(){
    const data=this.getSongData();
    if(!data) return this.notify('⚠️ Escribe un título primero');
    const db=JSON.parse(localStorage.getItem('sw_db_v3')||'{}');
    db[data.t]=data;
    localStorage.setItem('sw_db_v3',JSON.stringify(db));
    this.notify('✅ Guardado localmente');
    this.updatePublishBtn();
  },

  // GitHub
  updatePublishBtn(){
    const btn=document.getElementById('btn-publish');
    const ok=this.gh.owner&&this.gh.repo&&this.gh.token;
    btn.classList.toggle('hidden',!ok);
    const st=document.getElementById('gh-status');
    if(st){
      st.textContent=ok?'Configurado':'No configurado';
      st.className=ok?'text-[10px] px-2 py-0.5 rounded-full bg-emerald-900/40 text-emerald-400'
                     :'text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400';
    }
  },

  async publicarAlRepo(){
    if(!this.gh.token) return this.notify('⚠️ Configura el token primero');
    const data=this.getSongData();
    if(!data) return this.notify('⚠️ Guarda la canción primero');
    if(!confirm(`¿Publicar "${data.t}" al repositorio?\nTodos verán esta canción.`)) return;

    const btn=document.getElementById('btn-publish');
    const orig=btn.innerHTML;
    btn.innerHTML='<div class="spinner"></div>';
    btn.disabled=true;

    try{
      const path='songs.json';
      const api=`https://api.github.com/repos/${this.gh.owner}/${this.gh.repo}/contents/${path}`;
      let sha=null, current={};

      const getRes=await fetch(api,{headers:{
        'Authorization':`Bearer ${this.gh.token}`,
        'Accept':'application/vnd.github+json',
        'X-GitHub-Api-Version':'2022-11-28'
      }});
      if(getRes.ok){
        const file=await getRes.json();
        sha=file.sha;
        current=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,'')))));
      } else if(getRes.status!==404) throw new Error('No se pudo leer el archivo');

      current[data.t]=data;
      const content=btoa(unescape(encodeURIComponent(JSON.stringify(current,null,2))));

      const putRes=await fetch(api,{
        method:'PUT',
        headers:{
          'Authorization':`Bearer ${this.gh.token}`,
          'Accept':'application/vnd.github+json',
          'X-GitHub-Api-Version':'2022-11-28',
          'Content-Type':'application/json'
        },
        body:JSON.stringify({message:`🎵 ${data.t}`,content,sha:sha||undefined,branch:'main'})
      });
      if(!putRes.ok){
        const err=await putRes.json();
        throw new Error(err.message||'Error al publicar');
      }

      const local=JSON.parse(localStorage.getItem('sw_db_v3')||'{}');
      local[data.t]=data;
      localStorage.setItem('sw_db_v3',JSON.stringify(local));
      this.notify('☁️ ¡Publicado en el repositorio!');
    }catch(e){
      console.error(e);
      this.notify('❌ '+ (e.message||'Error al publicar'));
    }finally{
      btn.innerHTML=orig;
      btn.disabled=false;
    }
  },

  async cargarDesdeRepo(silent=false){
    try{
      let data=null;
      for(const r of ['./songs.json','/songs.json','songs.json']){
        try{
          const res=await fetch(r+'?t='+Date.now());
          if(res.ok){ data=await res.json(); break; }
        }catch(e){}
      }
      if(!data){ if(!silent) this.notify('⚠️ No se encontró songs.json'); return; }
      const current=JSON.parse(localStorage.getItem('sw_db_v3')||'{}');
      localStorage.setItem('sw_db_v3',JSON.stringify(silent?{...current,...data}:{...data,...current}));
      if(!silent){ this.notify('✅ Biblioteca actualizada'); this.toggleBib(true); }
    }catch(e){ if(!silent) this.notify('❌ Error al cargar'); }
  },

  // Biblioteca UI
  toggleBib(show){
    document.getElementById('modal-bib').classList.toggle('hidden',!show);
    if(show){ document.getElementById('search-bib').value=''; this.filtrarBib(''); }
  },
  filtrarBib(q){
    const db=JSON.parse(localStorage.getItem('sw_db_v3')||'{}');
    const keys=Object.keys(db).sort((a,b)=>a.localeCompare(b,'es'));
    const filtered=q.trim()?keys.filter(k=>k.toLowerCase().includes(q.toLowerCase())):keys;
    document.getElementById('bib-count').textContent=`${keys.length} canción${keys.length!==1?'es':''}`;
    const lista=document.getElementById('lista-bib');
    if(!filtered.length){
      lista.innerHTML=`<div class="text-center py-12 text-slate-500 text-sm">No hay canciones</div>`;
      return;
    }
    lista.innerHTML=filtered.map(k=>{
      const s=db[k];
      const meta=[s.tono,s.bpm?s.bpm+' BPM':''].filter(Boolean).join(' · ');
      return `<div class="flex items-center gap-2 p-3 rounded-xl bg-[var(--bg)] hover:bg-[var(--surface2)] border border-[var(--border)] transition group">
        <div class="flex-1 min-w-0 cursor-pointer" onclick="App.cargar('${k.replace(/'/g,"\\'")}')">
          <div class="font-semibold text-indigo-200 truncate">${k}</div>
          ${meta?`<div class="text-[11px] text-slate-500 mt-0.5">${meta}</div>`:''}
        </div>
        <button onclick="App.del('${k.replace(/'/g,"\\'")}')" class="opacity-40 group-hover:opacity-100 text-rose-500 p-1.5">🗑️</button>
      </div>`;
    }).join('');
  },
  cargar(k){
    const s=JSON.parse(localStorage.getItem('sw_db_v3')||'{}')[k];
    if(!s) return;
    document.getElementById('titulo').value=s.t||'';
    document.getElementById('tono').value=s.tono||'';
    document.getElementById('bpm').value=s.bpm||'';
    document.getElementById('check-cols').checked=!!s.cols;
    document.getElementById('check-notas').checked=s.notas!==false;
    if(s.size){ document.getElementById('font-size-range').value=s.size; this.updateFontSize(s.size); }
    this.elLista.innerHTML='';
    (s.secs||[]).forEach(x=>this.addSec(x.tipo,x.txt));
    this.toggleBib(false);
    this.render();
    this.notify('📂 Canción cargada');
  },
  del(k){
    if(!confirm(`¿Borrar "${k}"?`)) return;
    const db=JSON.parse(localStorage.getItem('sw_db_v3')||'{}');
    delete db[k];
    localStorage.setItem('sw_db_v3',JSON.stringify(db));
    this.filtrarBib(document.getElementById('search-bib').value);
    this.notify('🗑️ Eliminada');
  },
  exportarDB(){
    const db=localStorage.getItem('sw_db_v3');
    if(!db||db==='{}') return this.notify('⚠️ No hay canciones');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([db],{type:'application/json'}));
    a.download=`backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    this.notify('📤 Backup descargado');
  },
  importarDB(input){
    if(!input.files[0]) return;
    const r=new FileReader();
    r.onload=e=>{
      try{
        const imp=JSON.parse(e.target.result);
        const cur=JSON.parse(localStorage.getItem('sw_db_v3')||'{}');
        localStorage.setItem('sw_db_v3',JSON.stringify({...cur,...imp}));
        this.notify('📥 Importado');
        this.toggleBib(true);
      }catch{ this.notify('❌ JSON inválido'); }
    };
    r.readAsText(input.files[0]);
    input.value='';
  },

  // Config
  toggleConfig(show){
    document.getElementById('modal-config').classList.toggle('hidden',!show);
    if(show){
      document.getElementById('cfg-church').value=this.churchName;
      document.getElementById('cfg-gh-owner').value=this.gh.owner;
      document.getElementById('cfg-gh-repo').value=this.gh.repo;
      document.getElementById('cfg-gh-token').value=this.gh.token;
      this.updatePublishBtn();
    }
  },
  saveConfig(){
    this.churchName=document.getElementById('cfg-church').value.trim()||'Ministerio de Alabanza';
    localStorage.setItem('sw_church',this.churchName);
    this.gh={
      owner:document.getElementById('cfg-gh-owner').value.trim(),
      repo:document.getElementById('cfg-gh-repo').value.trim(),
      token:document.getElementById('cfg-gh-token').value.trim()
    };
    localStorage.setItem('sw_gh',JSON.stringify(this.gh));
    this.updatePublishBtn();
    this.render();
    this.toggleConfig(false);
    this.notify('✅ Configuración guardada');
  },

  notify(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.add('show');
    clearTimeout(this._t);
    this._t=setTimeout(()=>t.classList.remove('show'),2600);
  }
};

window.onload=()=>App.init();
</script>
</body>
