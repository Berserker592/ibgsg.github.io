<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I.B.G.S.G</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #f4f4f2;
    color: #1a1a1a;
    margin: 0;
    height: 100dvh;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .custom-scroll::-webkit-scrollbar { width: 4px; }
  .custom-scroll::-webkit-scrollbar-thumb { background: #d4d4d0; border-radius: 99px; }

  .sec-ta {
    font-family: 'JetBrains Mono', monospace;
    background: #fafafa;
    border: 1px solid #e5e5e2;
    color: #1a1a1a;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    outline: none;
    resize: none;
    min-height: 88px;
  }
  .sec-ta:focus { border-color: #1a1a1a; }

  .chord-block { margin-bottom: 14px; break-inside: avoid; }
  .chord-block .sec-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: #78716c; margin-bottom: 4px;
  }
  .lyric-line {
    font-family: 'JetBrains Mono', monospace;
    white-space: pre;
    margin: 0 0 2px 0;
    line-height: 1.15;
  }
  .lyric-line.chords { color: #1d4ed8; font-weight: 700; font-size: 0.85em; min-height: 1.1em; }
  .lyric-line.words { color: #1a1a1a; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    font-weight: 600; font-size: 12px; border-radius: 7px;
    transition: background .12s, color .12s; cursor: pointer; border: none; user-select: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn-dark { background: #1a1a1a; color: #fff; }
  .btn-dark:hover { background: #333; }
  .btn-ghost { background: #fff; color: #525252; border: 1px solid #e5e5e2; }
  .btn-ghost:hover { background: #f5f5f4; color: #1a1a1a; }
  .btn-green { background: #166534; color: #fff; }

  .section-card {
    background: #fff;
    border: 1px solid #e8e8e5;
    border-radius: 10px;
    border-left: 3px solid #a8a29e;
  }

  /* Character-level chord placement */
  .char-line { margin-bottom: 10px; line-height: 1.2; }
  .char-cell {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 0 0.5px;
    border-radius: 3px;
    min-width: 0.55em;
    vertical-align: bottom;
  }
  .char-cell:hover { background: #eef2ff; }
  .char-cell .ch {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    color: #1d4ed8;
    line-height: 1;
    min-height: 11px;
    white-space: nowrap;
  }
  .char-cell .lt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.2;
    color: #1a1a1a;
  }
  .char-cell.space .lt { min-width: 0.4em; }

  #chord-pop {
    position: fixed; z-index: 200;
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.12);
    width: min(300px, calc(100vw - 24px));
    display: none;
  }
  #chord-pop.open { display: block; }
  .c-btn {
    background: #fafafa;
    border: 1px solid #e5e5e2;
    color: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 12px;
    padding: 7px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .c-btn:hover { border-color: #1a1a1a; }
  .c-btn.on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }

  #toast {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(8px);
    padding: 10px 18px; border-radius: 999px; background: #1a1a1a; color: #fff;
    font-weight: 600; font-size: 13px; z-index: 500; opacity: 0; pointer-events: none;
    transition: all .22s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Projection mode */
  #proj-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 400;
    background: #fff; overflow: auto; padding: 40px 24px;
  }
  #proj-overlay.open { display: block; }

  @media (max-width: 768px) {
    .view-panel { display: none; }
    .view-panel.active { display: flex; flex-direction: column; }
  }
</style>
</head>
<body class="flex flex-col">

<header class="bg-white border-b border-[#e8e8e5] px-3 py-2 flex items-center justify-between shrink-0 z-50">
  <div class="flex items-center gap-2.5 min-w-0">
    <div class="w-8 h-8 rounded-md bg-[#1a1a1a] flex items-center justify-center text-white text-[10px] font-bold shrink-0">IB</div>
    <div class="min-w-0">
      <div class="font-semibold text-xs sm:text-sm text-[#1a1a1a] tracking-wide truncate">Ministerio de Alabanza "Iglesia Bíblica Gracia Sobre Gracia"</div>
      <div class="text-[9px] text-[#a3a3a3] hidden sm:block">Cancionero</div>
    </div>
  </div>
  <div class="flex items-center gap-1 shrink-0">
    <button onclick="App.guardar()" class="btn btn-dark px-3 py-1.5 text-[11px]">Guardar</button>
    <button id="btn-publish" onclick="App.publicarAlRepo()" class="btn btn-green px-3 py-1.5 text-[11px] hidden">Publicar</button>
    <button onclick="App.descargarPDF()" class="btn btn-ghost px-2.5 py-1.5 text-[11px]">PDF</button>
    <button onclick="App.imprimir()" class="btn btn-ghost px-2.5 py-1.5 text-[11px]">Imprimir</button>
    <button onclick="App.toggleProj(true)" class="btn btn-ghost px-2.5 py-1.5 text-[11px]" title="Proyección">⛶</button>
    <button onclick="App.toggleBib(true)" class="btn btn-ghost p-1.5 text-sm">📚</button>
    <button onclick="App.toggleConfig(true)" class="btn btn-ghost p-1.5 text-sm">⚙️</button>
  </div>
</header>

<div id="mobile-tabs" class="md:hidden flex border-b border-[#e8e8e5] bg-white shrink-0">
  <button id="tab-editor" onclick="App.showPanel('editor')" class="flex-1 py-2.5 text-xs font-semibold text-[#1a1a1a] border-b-2 border-[#1a1a1a]">Editor</button>
  <button id="tab-previa" onclick="App.showPanel('previa')" class="flex-1 py-2.5 text-xs font-semibold text-[#a3a3a3] border-b-2 border-transparent">Vista previa</button>
</div>

<main class="flex flex-1 overflow-hidden">
  <section id="panel-editor" class="view-panel active w-full md:w-[45%] flex flex-col border-r border-[#e8e8e5] bg-[#fafaf9]">
    <div class="flex-1 overflow-y-auto custom-scroll p-3 sm:p-4">
      <div class="max-w-lg mx-auto space-y-3">

        <input id="titulo" type="text" placeholder="Título de la canción..."
               class="w-full bg-transparent text-xl font-semibold border-b border-[#e5e5e2] outline-none pb-1.5 focus:border-[#1a1a1a] placeholder:text-[#c4c4c0]">

        <div class="grid grid-cols-3 gap-2">
          <div class="space-y-1">
            <label class="text-[10px] font-medium text-[#a3a3a3] uppercase tracking-wider">Tono</label>
            <input id="tono" placeholder="G#m" class="w-full p-2 rounded-lg bg-white border border-[#e5e5e2] text-sm outline-none focus:border-[#1a1a1a] mono">
          </div>
          <div class="space-y-1">
            <label class="text-[10px] font-medium text-[#a3a3a3] uppercase tracking-wider">Capo</label>
            <input id="capo" type="number" min="0" max="12" placeholder="0" class="w-full p-2 rounded-lg bg-white border border-[#e5e5e2] text-sm outline-none focus:border-[#1a1a1a]">
          </div>
          <div class="space-y-1">
            <label class="text-[10px] font-medium text-[#a3a3a3] uppercase tracking-wider">BPM</label>
            <input id="bpm" type="number" placeholder="72" class="w-full p-2 rounded-lg bg-white border border-[#e5e5e2] text-sm outline-none focus:border-[#1a1a1a]">
          </div>
        </div>
        <div class="flex gap-1">
          <button onclick="App.transportar(-1)" class="btn btn-ghost flex-1 py-1 text-[10px]">−1</button>
          <button onclick="App.transportar(-0.5)" class="btn btn-ghost flex-1 py-1 text-[10px]">−½</button>
          <button onclick="App.transportar(0.5)" class="btn btn-ghost flex-1 py-1 text-[10px]">+½</button>
          <button onclick="App.transportar(1)" class="btn btn-ghost flex-1 py-1 text-[10px]">+1</button>
        </div>

        <div class="bg-white rounded-xl border border-[#e8e8e5] p-3 space-y-2">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <span class="text-[11px] text-[#737373]">Tamaño: <span id="val-size" class="font-semibold text-[#1a1a1a]">16px</span></span>
            <div class="flex gap-3">
              <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" id="check-notas" checked onchange="App.render()" class="w-3.5 h-3.5">
                <span class="text-[11px] font-medium">Acordes</span>
              </label>
              <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" id="check-cols" onchange="App.render()" class="w-3.5 h-3.5">
                <span class="text-[11px] font-medium text-[#737373]">2 cols</span>
              </label>
            </div>
          </div>
          <input type="range" id="font-size-range" min="11" max="24" value="16" oninput="App.updateFontSize(this.value)" class="w-full accent-[#1a1a1a]">
        </div>

        <div class="flex items-center justify-between bg-white rounded-xl border border-[#e8e8e5] px-3 py-2.5">
          <div>
            <div class="text-sm font-medium">Modo colocar acordes</div>
            <div class="text-[10px] text-[#a3a3a3]">Clic en cualquier letra / sílaba</div>
          </div>
          <button id="btn-chord-mode" onclick="App.toggleChordMode()" class="btn btn-ghost px-3 py-1.5 text-[11px]">Activar</button>
        </div>

        <div id="lista-secciones" class="space-y-3 pb-32"></div>
      </div>
    </div>

    <div class="shrink-0 p-2 bg-white border-t border-[#e8e8e5]">
      <div class="grid grid-cols-4 gap-1 max-w-lg mx-auto">
        <button onclick="App.addSec('intro')" class="btn btn-ghost py-2 text-[9px]">+ Intro</button>
        <button onclick="App.addSec('estrofa')" class="btn btn-ghost py-2 text-[9px]">+ Estrofa</button>
        <button onclick="App.addSec('precoro')" class="btn btn-ghost py-2 text-[9px]">+ Pre</button>
        <button onclick="App.addSec('coro')" class="btn btn-ghost py-2 text-[9px]">+ Coro</button>
        <button onclick="App.addSec('puente')" class="btn btn-ghost py-2 text-[9px]">+ Puente</button>
        <button onclick="App.addSec('instrumental')" class="btn btn-ghost py-2 text-[9px]">+ Instr</button>
        <button onclick="App.addSec('final')" class="btn btn-ghost py-2 text-[9px]">+ Final</button>
        <button onclick="App.clearAll()" class="btn btn-ghost py-2 text-[9px] text-red-600">Limpiar</button>
      </div>
    </div>
  </section>

  <section id="panel-previa" class="view-panel w-full md:w-[55%] bg-[#ecece9] overflow-y-auto custom-scroll p-3 sm:p-6">
    <div class="mx-auto bg-white shadow-sm border border-[#e5e5e2] rounded-md min-h-full max-w-[680px]">
      <div id="render-target" class="p-6 sm:p-10"></div>
    </div>
  </section>
</main>

<!-- Projection -->
<div id="proj-overlay">
  <div class="max-w-3xl mx-auto">
    <div class="flex justify-end mb-4">
      <button onclick="App.toggleProj(false)" class="btn btn-ghost px-3 py-1.5">Cerrar proyección</button>
    </div>
    <div id="proj-content"></div>
  </div>
</div>

<!-- Chord popover -->
<div id="chord-pop">
  <div class="text-[10px] font-medium text-[#a3a3a3] uppercase tracking-wider mb-2">Acorde en esta sílaba</div>
  <div class="grid grid-cols-6 gap-1 mb-2" id="pop-roots">
    <button class="c-btn" data-r="C">C</button>
    <button class="c-btn" data-r="C#">C#</button>
    <button class="c-btn" data-r="D">D</button>
    <button class="c-btn" data-r="Eb">Eb</button>
    <button class="c-btn" data-r="E">E</button>
    <button class="c-btn" data-r="F">F</button>
    <button class="c-btn" data-r="F#">F#</button>
    <button class="c-btn" data-r="G">G</button>
    <button class="c-btn" data-r="Ab">Ab</button>
    <button class="c-btn" data-r="A">A</button>
    <button class="c-btn" data-r="Bb">Bb</button>
    <button class="c-btn" data-r="B">B</button>
  </div>
  <div class="grid grid-cols-5 gap-1 mb-2" id="pop-quals">
    <button class="c-btn" data-q="">maj</button>
    <button class="c-btn" data-q="m">m</button>
    <button class="c-btn" data-q="7">7</button>
    <button class="c-btn" data-q="m7">m7</button>
    <button class="c-btn" data-q="maj7">Δ7</button>
    <button class="c-btn" data-q="sus4">sus4</button>
    <button class="c-btn" data-q="sus2">sus2</button>
    <button class="c-btn" data-q="dim">dim</button>
    <button class="c-btn" data-q="aug">aug</button>
    <button class="c-btn" data-q="2">2</button>
  </div>
  <div class="flex gap-2">
    <button onclick="App.applyChord()" class="btn btn-dark flex-1 py-2 text-[11px]">Colocar</button>
    <button onclick="App.removeChordAtTarget()" class="btn btn-ghost py-2 px-3 text-[11px]">Quitar</button>
    <button onclick="App.closePop()" class="btn btn-ghost py-2 px-3 text-[11px]">✕</button>
  </div>
</div>

<!-- Biblioteca -->
<div id="modal-bib" class="fixed inset-0 hidden z-[100] flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-[2px] p-0 sm:p-4">
  <div class="bg-white w-full sm:max-w-md sm:rounded-xl border border-[#e5e5e2] flex flex-col max-h-[85vh] shadow-xl">
    <div class="flex items-center justify-between p-3.5 border-b border-[#e8e8e5]">
      <div>
        <div class="font-semibold text-sm">Biblioteca</div>
        <div class="text-[10px] text-[#a3a3a3]" id="bib-count">0 canciones</div>
      </div>
      <div class="flex gap-1">
        <button onclick="App.cargarDesdeRepo()" class="btn btn-ghost px-2 py-1 text-[10px]">🔄</button>
        <button onclick="document.getElementById('file-import').click()" class="btn btn-ghost px-2 py-1 text-[10px]">Import</button>
        <button onclick="App.exportarDB()" class="btn btn-ghost px-2 py-1 text-[10px]">Backup</button>
        <button onclick="App.toggleBib(false)" class="btn btn-ghost px-2 py-1">✕</button>
      </div>
    </div>
    <div class="p-2.5 border-b border-[#e8e8e5]">
      <input id="search-bib" type="text" placeholder="Buscar..." oninput="App.filtrarBib(this.value)"
             class="w-full p-2 rounded-lg bg-[#fafafa] border border-[#e5e5e2] text-sm outline-none focus:border-[#1a1a1a]">
    </div>
    <input type="file" id="file-import" class="hidden" accept=".json" onchange="App.importarDB(this)">
    <div id="lista-bib" class="flex-1 overflow-y-auto custom-scroll p-2.5 space-y-1"></div>
  </div>
</div>

<!-- Config -->
<div id="modal-config" class="fixed inset-0 hidden z-[100] flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-[2px] p-0 sm:p-4">
  <div class="bg-white w-full sm:max-w-md sm:rounded-xl border border-[#e5e5e2] flex flex-col max-h-[90vh] shadow-xl">
    <div class="flex items-center justify-between p-3.5 border-b border-[#e8e8e5]">
      <div class="font-semibold text-sm">Configuración</div>
      <button onclick="App.toggleConfig(false)" class="btn btn-ghost px-2 py-1">✕</button>
    </div>
    <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-5">
      <div>
        <label class="text-[10px] font-medium text-[#a3a3a3] uppercase tracking-wider block mb-1">Ministerio</label>
        <input id="cfg-church" type="text" class="w-full p-2.5 rounded-lg bg-[#fafafa] border border-[#e5e5e2] text-sm outline-none focus:border-[#1a1a1a]">
      </div>
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-[10px] font-medium text-[#a3a3a3] uppercase tracking-wider">GitHub</label>
          <span id="gh-status" class="text-[10px] px-2 py-0.5 rounded-full bg-[#f5f5f4] text-[#737373]">No configurado</span>
        </div>
        <div class="bg-[#fafafa] rounded-xl border border-[#e5e5e2] p-3 space-y-3 text-sm">
          <div>
            <label class="text-[10px] text-[#a3a3a3] block mb-1">Owner</label>
            <input id="cfg-gh-owner" type="text" placeholder="tu-usuario" class="w-full p-2 rounded-lg bg-white border border-[#e5e5e2] text-sm outline-none">
            <p class="text-[10px] text-[#c4c4c0] mt-1">github.com/<b>OWNER</b>/repo</p>
          </div>
          <div>
            <label class="text-[10px] text-[#a3a3a3] block mb-1">Repositorio</label>
            <input id="cfg-gh-repo" type="text" placeholder="nombre-repo" class="w-full p-2 rounded-lg bg-white border border-[#e5e5e2] text-sm outline-none">
          </div>
          <div>
            <label class="text-[10px] text-[#a3a3a3] block mb-1">Token</label>
            <input id="cfg-gh-token" type="password" placeholder="github_pat_..." class="w-full p-2 rounded-lg bg-white border border-[#e5e5e2] text-sm outline-none mono">
          </div>
        </div>
      </div>
      <button onclick="App.saveConfig()" class="btn btn-dark w-full py-2.5">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const App = {
  configs: {
    intro: 'border-l-sky-400', estrofa: 'border-l-stone-400', precoro: 'border-l-violet-400',
    coro: 'border-l-emerald-500', puente: 'border-l-amber-500', instrumental: 'border-l-rose-400', final: 'border-l-neutral-400'
  },
  currentFontSize: 16,
  notasEscala: ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
  churchName: 'Ministerio de Alabanza "Iglesia Bíblica Gracia Sobre Gracia"',
  gh: { owner:'', repo:'', token:'' },
  chordMode: false,
  popRoot: null,
  popQual: '',
  targetSec: null,
  targetLine: null,
  targetCharIdx: null, // index in plain lyrics (without chord markers)

  init() {
    this.churchName = localStorage.getItem('sw_church') || this.churchName;
    const g = JSON.parse(localStorage.getItem('sw_gh') || '{}');
    this.gh = { owner: g.owner||'', repo: g.repo||'', token: g.token||'' };
    this.updatePublishBtn();

    this.elLista = document.getElementById('lista-secciones');
    Sortable.create(this.elLista, { handle:'.drag-handle', animation:140, onEnd:()=>this.render() });

    ['titulo','tono','bpm','capo'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', () => this.render());
    });

    document.querySelectorAll('#pop-roots .c-btn').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#pop-roots .c-btn').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        this.popRoot = b.dataset.r;
      };
    });
    document.querySelectorAll('#pop-quals .c-btn').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#pop-quals .c-btn').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        this.popQual = b.dataset.q;
      };
    });

    document.addEventListener('click', e => {
      const pop = document.getElementById('chord-pop');
      if (pop.classList.contains('open') && !pop.contains(e.target) && !e.target.closest('.char-cell')) {
        this.closePop();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        this.closePop();
        this.toggleProj(false);
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        this.guardar();
      }
    });

    this.cargarDesdeRepo(true);
    this.render();
  },

  /* ---------- Chord parsing (position-based) ---------- */
  // Returns array of { ch: string|null, letter: string } for each visible character
  tokenizeLine(line) {
    const tokens = [];
    let i = 0;
    let pendingChord = null;
    while (i < line.length) {
      if (line[i] === '[') {
        const end = line.indexOf(']', i);
        if (end !== -1) {
          pendingChord = line.slice(i + 1, end);
          i = end + 1;
          continue;
        }
      }
      const letter = line[i];
      tokens.push({ ch: pendingChord, letter });
      pendingChord = null;
      i++;
    }
    // If chord at end with no letter, attach to a spacer
    if (pendingChord) tokens.push({ ch: pendingChord, letter: ' ' });
    return tokens;
  },

  // Plain text length / map: build line with chord inserted before plainCharIndex
  insertChordAtPlainIndex(line, plainIdx, chordName) {
    // Remove any existing chord that starts at this plain index, then insert
    const tokens = this.tokenizeLine(line);
    // First clear chord at plainIdx
    if (tokens[plainIdx]) tokens[plainIdx].ch = chordName || null;
    // Rebuild
    return tokens.map(t => (t.ch ? `[${t.ch}]` : '') + t.letter).join('');
  },

  formatChordOverLyrics(line) {
    const tokens = this.tokenizeLine(line);
    if (!tokens.length) return null;
    let chordLine = '';
    let wordLine = '';
    let i = 0;
    while (i < tokens.length) {
      const t = tokens[i];
      if (t.ch) {
        // Chord starts here: write chord, then letters until next chord or end
        const chord = t.ch;
        let chunk = t.letter;
        let j = i + 1;
        while (j < tokens.length && !tokens[j].ch) {
          chunk += tokens[j].letter;
          j++;
        }
        const width = Math.max(chord.length, chunk.length);
        chordLine += chord + ' '.repeat(Math.max(0, width - chord.length));
        wordLine += chunk + ' '.repeat(Math.max(0, width - chunk.length));
        // gap space between groups if more content
        if (j < tokens.length) {
          chordLine += ' ';
          wordLine += ' ';
        }
        i = j;
      } else {
        // No chord: accumulate until a chord
        let chunk = '';
        while (i < tokens.length && !tokens[i].ch) {
          chunk += tokens[i].letter;
          i++;
        }
        chordLine += ' '.repeat(chunk.length);
        wordLine += chunk;
        if (i < tokens.length) {
          // about to hit a chord; no extra space needed (chord group adds its own)
        }
      }
    }
    const hasChords = tokens.some(t => t.ch);
    return {
      chords: hasChords ? chordLine.replace(/\s+$/, '') : '',
      words: wordLine.replace(/\s+$/, '')
    };
  },

  toggleChordMode() {
    this.chordMode = !this.chordMode;
    const btn = document.getElementById('btn-chord-mode');
    btn.textContent = this.chordMode ? 'Desactivar' : 'Activar';
    btn.className = this.chordMode ? 'btn btn-dark px-3 py-1.5 text-[11px]' : 'btn btn-ghost px-3 py-1.5 text-[11px]';
    this.refreshSectionsUI();
    this.notify(this.chordMode ? 'Toca cualquier letra para el acorde' : 'Modo texto');
  },

  refreshSectionsUI() {
    document.querySelectorAll('#lista-secciones > div').forEach(div => {
      const ta = div.querySelector('textarea');
      const visual = div.querySelector('.chord-visual');
      if (this.chordMode) {
        ta.style.display = 'none';
        if (visual) { visual.style.display = 'block'; this.buildCharChips(div); }
      } else {
        ta.style.display = 'block';
        if (visual) visual.style.display = 'none';
      }
    });
  },

  buildCharChips(secDiv) {
    const ta = secDiv.querySelector('textarea');
    const visual = secDiv.querySelector('.chord-visual');
    if (!visual) return;
    const lines = ta.value.split('\n');
    visual.innerHTML = '';

    lines.forEach((line, li) => {
      const lineEl = document.createElement('div');
      lineEl.className = 'char-line';
      const tokens = this.tokenizeLine(line);
      if (!tokens.length) {
        lineEl.innerHTML = '<span class="text-[#c4c4c0] text-xs">—</span>';
      } else {
        tokens.forEach((t, ci) => {
          const cell = document.createElement('span');
          cell.className = 'char-cell' + (t.letter === ' ' ? ' space' : '');
          cell.innerHTML = `<span class="ch">${t.ch || ''}</span><span class="lt">${t.letter === ' ' ? '&nbsp;' : this.esc(t.letter)}</span>`;
          cell.onclick = (ev) => {
            ev.stopPropagation();
            this.openPop(secDiv, li, ci, t, ev);
          };
          lineEl.appendChild(cell);
        });
      }
      visual.appendChild(lineEl);
    });
  },

  openPop(secDiv, lineIdx, charIdx, token, ev) {
    this.targetSec = secDiv;
    this.targetLine = lineIdx;
    this.targetCharIdx = charIdx;
    this.popRoot = token.ch ? (token.ch.match(/^([A-G][#b]?)/) || [])[1] : null;
    this.popQual = token.ch ? token.ch.replace(/^[A-G][#b]?/, '') : '';

    document.querySelectorAll('#pop-roots .c-btn').forEach(b => b.classList.toggle('on', b.dataset.r === this.popRoot));
    document.querySelectorAll('#pop-quals .c-btn').forEach(b => b.classList.toggle('on', b.dataset.q === this.popQual));

    const pop = document.getElementById('chord-pop');
    pop.classList.add('open');
    const x = Math.min(ev.clientX, window.innerWidth - 320);
    const y = Math.min(ev.clientY + 6, window.innerHeight - 260);
    pop.style.left = Math.max(8, x) + 'px';
    pop.style.top = Math.max(8, y) + 'px';
  },

  closePop() {
    document.getElementById('chord-pop').classList.remove('open');
    this.targetSec = null;
  },

  applyChord() {
    if (!this.targetSec || !this.popRoot) return this.notify('Elige una nota');
    this.setChordAtChar(this.targetSec, this.targetLine, this.targetCharIdx, this.popRoot + this.popQual);
    this.closePop();
  },

  removeChordAtTarget() {
    if (!this.targetSec) return;
    this.setChordAtChar(this.targetSec, this.targetLine, this.targetCharIdx, '');
    this.closePop();
  },

  setChordAtChar(secDiv, lineIdx, charIdx, chord) {
    const ta = secDiv.querySelector('textarea');
    const lines = ta.value.split('\n');
    lines[lineIdx] = this.insertChordAtPlainIndex(lines[lineIdx] || '', charIdx, chord || null);
    ta.value = lines.join('\n');
    this.buildCharChips(secDiv);
    this.render();
  },

  showPanel(which) {
    document.getElementById('panel-editor').classList.toggle('active', which === 'editor');
    document.getElementById('panel-previa').classList.toggle('active', which === 'previa');
    document.getElementById('tab-editor').className = which === 'editor'
      ? 'flex-1 py-2.5 text-xs font-semibold text-[#1a1a1a] border-b-2 border-[#1a1a1a]'
      : 'flex-1 py-2.5 text-xs font-semibold text-[#a3a3a3] border-b-2 border-transparent';
    document.getElementById('tab-previa').className = which === 'previa'
      ? 'flex-1 py-2.5 text-xs font-semibold text-[#1a1a1a] border-b-2 border-[#1a1a1a]'
      : 'flex-1 py-2.5 text-xs font-semibold text-[#a3a3a3] border-b-2 border-transparent';
  },

  updateFontSize(v) {
    this.currentFontSize = +v;
    document.getElementById('val-size').textContent = v + 'px';
    this.render();
  },

  addSec(tipo, txt = '') {
    const div = document.createElement('div');
    div.className = `section-card p-3 ${this.configs[tipo] || ''}`;
    div.dataset.tipo = tipo;
    div.innerHTML = `
      <div class="flex justify-between items-center mb-1.5">
        <span class="drag-handle text-[10px] font-medium uppercase tracking-wider text-[#a3a3a3] cursor-grab">⠿ ${tipo}</span>
        <button onclick="this.closest('[data-tipo]').remove();App.render()" class="text-[#c4c4c0] hover:text-red-500 text-sm px-1">✕</button>
      </div>
      <textarea class="sec-ta" oninput="App.onSecInput(this)" placeholder="Escribe la letra...">${txt}</textarea>
      <div class="chord-visual mt-1" style="display:none"></div>`;
    this.elLista.appendChild(div);
    if (this.chordMode) {
      div.querySelector('textarea').style.display = 'none';
      div.querySelector('.chord-visual').style.display = 'block';
      this.buildCharChips(div);
    }
    this.render();
    setTimeout(() => div.querySelector('textarea').focus(), 30);
  },

  onSecInput(ta) {
    if (this.chordMode) this.buildCharChips(ta.closest('[data-tipo]'));
    this.render();
  },

  clearAll() {
    if (!confirm('¿Borrar todas las secciones?')) return;
    this.elLista.innerHTML = '';
    this.render();
  },

  transportar(pasos) {
    document.querySelectorAll('.sec-ta').forEach(box => {
      box.value = box.value.replace(/\[(.*?)\]/g, (_, n) => `[${this.cambiarNota(n, pasos)}]`);
    });
    const tono = document.getElementById('tono');
    if (tono.value) tono.value = this.cambiarNota(tono.value, pasos);
    if (this.chordMode) this.refreshSectionsUI();
    this.render();
    this.notify(`Transportado ${pasos > 0 ? '+' : ''}${pasos}`);
  },

  cambiarNota(notaStr, pasos) {
    const m = notaStr.match(/^([A-G][#b]?)(.*)/);
    if (!m) return notaStr;
    let raiz = m[1], sufijo = m[2];
    const map = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', Bb: 'A#' };
    if (map[raiz]) raiz = map[raiz];
    let i = this.notasEscala.indexOf(raiz);
    if (i === -1) return notaStr;
    let ni = (i + pasos * 2) % 12;
    while (ni < 0) ni += 12;
    return this.notasEscala[ni] + sufijo;
  },

  render() {
    const t = document.getElementById('titulo').value || 'SIN TÍTULO';
    const tono = document.getElementById('tono').value || '—';
    const bpm = document.getElementById('bpm').value || '—';
    const capo = document.getElementById('capo').value;
    const cols = document.getElementById('check-cols').checked;
    const showChords = document.getElementById('check-notas').checked;
    const items = [...document.querySelectorAll('#lista-secciones > div')];
    const fs = this.currentFontSize;

    const capoStr = capo && +capo > 0 ? ` &nbsp;·&nbsp; CAPO: ${capo}` : '';

    let h = `<div style="text-align:center;margin-bottom:20px">
      <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#78716c;
                  border-bottom:1px solid #d6d3d1;padding-bottom:6px;margin-bottom:10px">${this.churchName}</div>
      <h1 style="font-size:22px;margin:0;font-weight:700;text-transform:uppercase;line-height:1.2;color:#1a1a1a">${t}</h1>
      <div style="font-size:11px;margin-top:8px;font-family:'JetBrains Mono',monospace;color:#444;font-weight:600">
        TONO: ${tono} &nbsp;·&nbsp; BPM: ${bpm}${capoStr}
      </div>
    </div>
    <div style="${cols ? 'column-count:2;column-gap:28px;column-rule:1px solid #e7e5e4' : ''}">`;

    let contE = 1;
    items.forEach(it => {
      const tipo = it.dataset.tipo;
      const lines = it.querySelector('textarea').value.split('\n');
      let body = '';

      lines.forEach(line => {
        if (!line.trim() && !/\S/.test(line)) return;
        if (!showChords) {
          const clean = line.replace(/\[.*?\]/g, '');
          if (clean.trim()) {
            body += `<div class="lyric-line words" style="font-size:${fs}px">${this.esc(clean)}</div>`;
          }
        } else {
          const formatted = this.formatChordOverLyrics(line);
          if (!formatted) return;
          if (formatted.chords) {
            body += `<div class="lyric-line chords" style="font-size:${Math.max(11, fs - 2)}px">${this.esc(formatted.chords)}</div>`;
          }
          body += `<div class="lyric-line words" style="font-size:${fs}px;margin-bottom:6px">${this.esc(formatted.words)}</div>`;
        }
      });

      if (body) {
        let label = tipo.toUpperCase();
        if (tipo === 'estrofa') label += ' ' + (contE++);
        h += `<div class="chord-block"><div class="sec-label">${label}</div>${body}</div>`;
      }
    });

    h += '</div>';
    document.getElementById('render-target').innerHTML = h;
  },

  esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  },

  toggleProj(show) {
    const el = document.getElementById('proj-overlay');
    if (show) {
      this.render();
      document.getElementById('proj-content').innerHTML = document.getElementById('render-target').innerHTML;
      el.classList.add('open');
    } else {
      el.classList.remove('open');
    }
  },

  imprimir() {
    this.render();
    const content = document.getElementById('render-target').innerHTML;
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>${this.churchName}</title>
      <style>
        body { font-family: 'JetBrains Mono', monospace; padding: 36px; color: #1a1a1a; background: #fff; }
        .chord-block { margin-bottom: 16px; break-inside: avoid; }
        .sec-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #78716c; margin-bottom: 4px; font-family: Inter, sans-serif; }
        .lyric-line { white-space: pre; margin: 0 0 2px 0; line-height: 1.15; font-family: 'JetBrains Mono', monospace; }
        .lyric-line.chords { color: #1d4ed8; font-weight: 700; }
        .lyric-line.words { color: #1a1a1a; }
        h1 { font-family: Inter, sans-serif; }
      </style>
    </head><body>${content}</body></html>`);
    win.document.close();
    setTimeout(() => { win.focus(); win.print(); }, 400);
  },

  descargarPDF() {
    this.render();
    const el = document.getElementById('render-target');
    const titulo = document.getElementById('titulo').value || 'cancion';
    this.notify('Generando PDF...');
    html2pdf().set({
      margin: [14, 14],
      filename: `${titulo}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 3, useCORS: true, letterRendering: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(el).save().then(() => this.notify('PDF listo'));
  },

  getSongData() {
    const t = document.getElementById('titulo').value.trim();
    if (!t) return null;
    return {
      t,
      tono: document.getElementById('tono').value,
      bpm: document.getElementById('bpm').value,
      capo: document.getElementById('capo').value,
      size: this.currentFontSize,
      cols: document.getElementById('check-cols').checked,
      notas: document.getElementById('check-notas').checked,
      secs: [...document.querySelectorAll('#lista-secciones > div')].map(s => ({
        tipo: s.dataset.tipo,
        txt: s.querySelector('textarea').value
      })),
      updated: new Date().toISOString()
    };
  },

  getDeleted() {
    try { return JSON.parse(localStorage.getItem('sw_deleted') || '[]'); } catch { return []; }
  },
  setDeleted(arr) {
    localStorage.setItem('sw_deleted', JSON.stringify(arr));
  },

  guardar() {
    const data = this.getSongData();
    if (!data) return this.notify('Escribe un título');
    const db = JSON.parse(localStorage.getItem('sw_db_v3') || '{}');
    db[data.t] = data;
    localStorage.setItem('sw_db_v3', JSON.stringify(db));
    // If it was previously deleted, undelete
    const del = this.getDeleted().filter(x => x !== data.t);
    this.setDeleted(del);
    this.notify('Guardado');
  },

  updatePublishBtn() {
    const ok = this.gh.owner && this.gh.repo && this.gh.token;
    document.getElementById('btn-publish').classList.toggle('hidden', !ok);
    const st = document.getElementById('gh-status');
    if (st) {
      st.textContent = ok ? 'Listo' : 'No configurado';
      st.className = ok
        ? 'text-[10px] px-2 py-0.5 rounded-full bg-green-50 text-green-700'
        : 'text-[10px] px-2 py-0.5 rounded-full bg-[#f5f5f4] text-[#737373]';
    }
  },

  async pushDbToRepo(db, message) {
    const api = `https://api.github.com/repos/${this.gh.owner}/${this.gh.repo}/contents/songs.json`;
    let sha = null;
    const getRes = await fetch(api, {
      headers: {
        'Authorization': `Bearer ${this.gh.token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }
    });
    if (getRes.ok) {
      const file = await getRes.json();
      sha = file.sha;
    } else if (getRes.status !== 404) {
      throw new Error('No se pudo leer songs.json');
    }
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
    const putRes = await fetch(api, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${this.gh.token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message, content, sha: sha || undefined, branch: 'main' })
    });
    if (!putRes.ok) {
      const err = await putRes.json();
      throw new Error(err.message || 'Error al escribir');
    }
  },

  async publicarAlRepo() {
    if (!this.gh.token) return this.notify('Configura GitHub');
    const data = this.getSongData();
    if (!data) return this.notify('Guarda la canción primero');
    if (!confirm(`¿Publicar "${data.t}"?`)) return;
    const btn = document.getElementById('btn-publish');
    const orig = btn.innerHTML;
    btn.innerHTML = '<div class="spinner"></div>';
    btn.disabled = true;
    try {
      // Load current local as source of truth (minus deleted)
      const local = JSON.parse(localStorage.getItem('sw_db_v3') || '{}');
      local[data.t] = data;
      localStorage.setItem('sw_db_v3', JSON.stringify(local));
      await this.pushDbToRepo(local, `🎵 ${data.t}`);
      this.notify('Publicado');
    } catch (e) {
      this.notify('Error: ' + (e.message || ''));
    } finally {
      btn.innerHTML = orig;
      btn.disabled = false;
    }
  },

  async cargarDesdeRepo(silent = false) {
    try {
      let data = null;
      for (const r of ['./songs.json', '/songs.json', 'songs.json']) {
        try {
          const res = await fetch(r + '?t=' + Date.now());
          if (res.ok) { data = await res.json(); break; }
        } catch (e) {}
      }
      if (!data) { if (!silent) this.notify('No hay songs.json'); return; }

      const deleted = this.getDeleted();
      const cur = JSON.parse(localStorage.getItem('sw_db_v3') || '{}');

      // Merge: start from repo, apply local overrides, remove deleted
      const merged = { ...data, ...cur };
      deleted.forEach(k => { delete merged[k]; });

      localStorage.setItem('sw_db_v3', JSON.stringify(merged));
      if (!silent) { this.notify('Biblioteca actualizada'); this.toggleBib(true); }
    } catch (e) {
      if (!silent) this.notify('Error al cargar');
    }
  },

  toggleBib(show) {
    document.getElementById('modal-bib').classList.toggle('hidden', !show);
    if (show) {
      document.getElementById('search-bib').value = '';
      this.filtrarBib('');
    }
  },

  filtrarBib(q) {
    const db = JSON.parse(localStorage.getItem('sw_db_v3') || '{}');
    const keys = Object.keys(db).sort((a, b) => a.localeCompare(b, 'es'));
    const filtered = q.trim() ? keys.filter(k => k.toLowerCase().includes(q.toLowerCase())) : keys;
    document.getElementById('bib-count').textContent = keys.length + ' canciones';
    const lista = document.getElementById('lista-bib');
    if (!filtered.length) {
      lista.innerHTML = '<div class="text-center py-10 text-[#a3a3a3] text-sm">Sin canciones</div>';
      return;
    }
    lista.innerHTML = filtered.map(k => {
      const s = db[k];
      const meta = [s.tono, s.bpm ? s.bpm + ' BPM' : '', s.capo && +s.capo ? 'Capo ' + s.capo : ''].filter(Boolean).join(' · ');
      return `<div class="flex items-center gap-1 p-2.5 rounded-lg bg-[#fafafa] border border-[#e8e8e5]">
        <div class="flex-1 min-w-0 cursor-pointer" onclick="App.cargar('${k.replace(/'/g, "\\'")}')">
          <div class="font-medium text-sm truncate">${k}</div>
          ${meta ? `<div class="text-[10px] text-[#a3a3a3]">${meta}</div>` : ''}
        </div>
        <button onclick="App.duplicar('${k.replace(/'/g, "\\'")}')" class="text-[#a3a3a3] hover:text-[#1a1a1a] text-[10px] px-1" title="Duplicar">⧉</button>
        <button onclick="App.exportarUna('${k.replace(/'/g, "\\'")}')" class="text-[#a3a3a3] hover:text-[#1a1a1a] text-[10px] px-1" title="Exportar texto">📄</button>
        <button onclick="App.del('${k.replace(/'/g, "\\'")}')" class="text-[#c4c4c0] hover:text-red-500 text-sm p-1">🗑</button>
      </div>`;
    }).join('');
  },

  cargar(k) {
    const s = JSON.parse(localStorage.getItem('sw_db_v3') || '{}')[k];
    if (!s) return;
    document.getElementById('titulo').value = s.t || '';
    document.getElementById('tono').value = s.tono || '';
    document.getElementById('bpm').value = s.bpm || '';
    document.getElementById('capo').value = s.capo || '';
    document.getElementById('check-cols').checked = !!s.cols;
    document.getElementById('check-notas').checked = s.notas !== false;
    if (s.size) {
      document.getElementById('font-size-range').value = s.size;
      this.updateFontSize(s.size);
    }
    this.elLista.innerHTML = '';
    this.chordMode = false;
    document.getElementById('btn-chord-mode').textContent = 'Activar';
    document.getElementById('btn-chord-mode').className = 'btn btn-ghost px-3 py-1.5 text-[11px]';
    (s.secs || []).forEach(x => this.addSec(x.tipo, x.txt));
    this.toggleBib(false);
    this.render();
    this.notify('Cargada');
  },

  async del(k) {
    if (!confirm(`¿Borrar "${k}"?\nSe eliminará de este dispositivo${this.gh.token ? ' y del repositorio' : ''}.`)) return;

    const db = JSON.parse(localStorage.getItem('sw_db_v3') || '{}');
    delete db[k];
    localStorage.setItem('sw_db_v3', JSON.stringify(db));

    // Remember deletion so repo reload doesn't bring it back
    const del = this.getDeleted();
    if (!del.includes(k)) del.push(k);
    this.setDeleted(del);

    // Sync delete to GitHub if configured
    if (this.gh.token && this.gh.owner && this.gh.repo) {
      try {
        await this.pushDbToRepo(db, `🗑️ Eliminar: ${k}`);
        this.notify('Eliminada (local + repo)');
      } catch (e) {
        this.notify('Eliminada local. Repo: ' + (e.message || 'error'));
      }
    } else {
      this.notify('Eliminada de este dispositivo');
    }

    this.filtrarBib(document.getElementById('search-bib').value);
  },

  duplicar(k) {
    const db = JSON.parse(localStorage.getItem('sw_db_v3') || '{}');
    const s = db[k];
    if (!s) return;
    let nuevo = k + ' (copia)';
    let i = 2;
    while (db[nuevo]) { nuevo = k + ' (copia ' + i + ')'; i++; }
    db[nuevo] = { ...JSON.parse(JSON.stringify(s)), t: nuevo, updated: new Date().toISOString() };
    localStorage.setItem('sw_db_v3', JSON.stringify(db));
    const del = this.getDeleted().filter(x => x !== nuevo);
    this.setDeleted(del);
    this.filtrarBib(document.getElementById('search-bib').value);
    this.notify('Duplicada');
  },

  exportarUna(k) {
    const s = JSON.parse(localStorage.getItem('sw_db_v3') || '{}')[k];
    if (!s) return;
    let txt = `${s.t}\nTono: ${s.tono || '—'} | BPM: ${s.bpm || '—'}${s.capo ? ' | Capo: ' + s.capo : ''}\n\n`;
    (s.secs || []).forEach(sec => {
      txt += `[${sec.tipo.toUpperCase()}]\n${sec.txt}\n\n`;
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
    a.download = k.replace(/[^\w\s-]/g, '') + '.txt';
    a.click();
  },

  exportarDB() {
    const db = localStorage.getItem('sw_db_v3');
    if (!db || db === '{}') return this.notify('Nada que exportar');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([db], { type: 'application/json' }));
    a.download = 'backup_IBGSG_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
  },

  importarDB(input) {
    if (!input.files[0]) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const imp = JSON.parse(e.target.result);
        const cur = JSON.parse(localStorage.getItem('sw_db_v3') || '{}');
        localStorage.setItem('sw_db_v3', JSON.stringify({ ...cur, ...imp }));
        // Clear deleted flags for imported titles
        const del = this.getDeleted().filter(k => !imp[k]);
        this.setDeleted(del);
        this.notify('Importado');
        this.toggleBib(true);
      } catch {
        this.notify('JSON inválido');
      }
    };
    r.readAsText(input.files[0]);
    input.value = '';
  },

  toggleConfig(show) {
    document.getElementById('modal-config').classList.toggle('hidden', !show);
    if (show) {
      document.getElementById('cfg-church').value = this.churchName;
      document.getElementById('cfg-gh-owner').value = this.gh.owner;
      document.getElementById('cfg-gh-repo').value = this.gh.repo;
      document.getElementById('cfg-gh-token').value = this.gh.token;
      this.updatePublishBtn();
    }
  },

  saveConfig() {
    this.churchName = document.getElementById('cfg-church').value.trim() || this.churchName;
    localStorage.setItem('sw_church', this.churchName);
    this.gh = {
      owner: document.getElementById('cfg-gh-owner').value.trim(),
      repo: document.getElementById('cfg-gh-repo').value.trim(),
      token: document.getElementById('cfg-gh-token').value.trim()
    };
    localStorage.setItem('sw_gh', JSON.stringify(this.gh));
    this.updatePublishBtn();
    this.render();
    this.toggleConfig(false);
    this.notify('Configuración guardada');
  },

  notify(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._t);
    this._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
};

window.onload = () => App.init();
</script>
</body>
</html>
